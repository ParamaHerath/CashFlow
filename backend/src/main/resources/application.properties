spring.application.name=cashflow-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/cashflow
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

app.jwt.issuer=cashflow
app.jwt.secret=${JWT_SECRET:change-me}
app.jwt.access-token-exp-min=15
app.jwt.refresh-token-exp-days=7
app.jwt.access-cookie-name=access_token
app.jwt.refresh-cookie-name=refresh_token
app.jwt.cookie-secure=false
app.jwt.cookie-same-site=Lax

app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type
app.cors.exposed-headers=Set-Cookie
